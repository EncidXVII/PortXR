name: Game report
description: How a game went in VR, working or not, with a script if you wrote one
labels: [compat]
body:
  - type: markdown
    attributes:
      value: Only report offline single-player games. Games with anti-cheat are refused on purpose and will not be supported.
  - type: input
    id: game
    attributes:
      label: Game
      description: Name, and the Steam store link if it has one
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What happens
      options:
        - Does not start, or crashes
        - Starts flat, no VR
        - VR works but the image is wrong (swapped, flipped, wrong scale, black)
        - UI or menus missing or unreadable
        - Controls do not work
        - Plays fine apart from a smaller issue
        - Plays fine
        - Plays fine with a script (paste it below)
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset and runtime
      description: e.g. Quest 3 with Virtual Desktop, Index with SteamVR
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you did and what you saw
  - type: textarea
    id: script
    attributes:
      label: Script
      description: A Lua script that fixed this game, to share with other players (SCRIPTING.md, Sharing a script)
      render: lua
  - type: markdown
    attributes:
      value: Attach the zip from **Export logs** in PortXR.exe (select the game, press Export logs).
