name: Bug
description: Something in PortXR itself (the app, the VR menu, install or uninstall)
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PortXR version
    validations:
      required: true
  - type: markdown
    attributes:
      value: If a game was involved, attach the zip from **Export logs** in PortXR.exe.
