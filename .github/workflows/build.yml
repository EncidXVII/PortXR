name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # No Unity on the runner, so no IL2CPP interop assemblies: CI builds the Mono payload only. Full releases
      # (both payloads) are packed locally with release.ps1 after fixtures\interop.ps1.
      - name: Build and pack
        shell: pwsh
        run: ./release.ps1 -MonoOnly
      - uses: actions/upload-artifact@v4
        with:
          name: parallax
          path: release/*

  # The Linux app installs the same Windows payload: games run it under Proton.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: cargo build --release --manifest-path app/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-linux-app
          path: app/target/release/Parallax

  linux-pack:
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Swap the Windows app for the Linux one
        run: |
          zip=$(ls parallax/*.zip | head -1)
          mkdir pkg && unzip -q "$zip" -d pkg && rm pkg/Parallax.exe
          install -m 755 parallax-linux-app/Parallax pkg/Parallax
          tar -czf "$(basename "$zip" .zip)-linux.tar.gz" -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-linux
          path: "*-linux.tar.gz"
