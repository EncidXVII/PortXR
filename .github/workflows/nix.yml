# Builds the Nix flake on each system it supports: the release files download and match their hashes, every library
# the app links and loads resolves in the Nix store, and the `portxr` command sets up its per-user copy.
name: Nix

on:
  push:
    paths: [flake.nix, flake.lock, .github/workflows/nix.yml]
  pull_request:
    paths: [flake.nix, flake.lock, .github/workflows/nix.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: nix build -L .#app -o app
      - run: nix build -L . -o pkg
      - name: Libraries resolve
        run: |
          bin=app/share/portxr/PortXR
          ldd "$bin"
          if ldd "$bin" | grep -q "not found"; then exit 1; fi
          # Loaded at run time, so not in the ldd list: each must sit in a folder on the binary's RUNPATH.
          rpath=$(nix run nixpkgs#patchelf -- --print-rpath "$bin")
          for lib in libxkbcommon.so.0 libwayland-client.so.0 libX11.so.6 libXcursor.so.1 libXi.so.6 libX11-xcb.so.1 libxkbcommon-x11.so.0 libXrender.so.1 libGL.so.1 libEGL.so.1 libwayland-egl.so.1 libdbus-1.so.3; do
            found=
            for dir in ${rpath//:/ }; do if [ -e "$dir/$lib" ]; then found=$dir/$lib; fi; done
            echo "$lib: ${found:-MISSING}"
            [ -n "$found" ]
          done
      - name: Per-user copy
        run: |
          export HOME=$RUNNER_TEMP/home XDG_DATA_HOME=
          mkdir -p "$HOME"
          # The app itself needs a desktop and SteamVR; it is only started so the launcher makes its copy.
          timeout 10 pkg/bin/portxr >/dev/null 2>&1 </dev/null || true
          dest=$HOME/.local/share/portxr
          ls -la "$dest"
          test -x "$dest/PortXR" -a -w "$dest/PortXR"
          test "$(cat "$dest/.nix-package")" = "$(readlink -f app)"
          test -w "$dest/payload/BepInEx/config/BepInEx.cfg" -a -e pkg/share/applications/portxr.desktop
      - name: Lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock-${{ matrix.runner }}
          path: flake.lock
          if-no-files-found: ignore
