[package]
name = "portxr"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "PortXR"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "glow", "default_fonts"] }
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.0", features = ["json"] }
zip = "9.1.0"

# Linux: X11 and Wayland windows, Wayland's library loaded at run time rather than linked.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
